name: Publish kics GitHub Action

# Run this workflow on Tags matching v* pattern and publish a new release
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: publish kics github action
    runs-on: cx-public-ubuntu-x64
    timeout-minutes: 10
    permissions:
      contents: write # for haya14busa/action-update-semver to push tags and gh release create to publish the release
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      with:
        persist-credentials: false
    - uses: haya14busa/action-update-semver@7d2c558640ea49e798d46539536190aff8c18715 #v1.5.1
      with:
        major_version_tag_only: true
    - name: Create a Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ github.ref_name }}
      run: gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" --verify-tag --generate-notes
