name: Test KICS action

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test kics github action
    runs-on: cx-public-ubuntu-x64
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # for enable_comments to post scan results on the PR
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false
      - run: mkdir -p myoutput
      # The runner cannot reach registry.npmjs.org, and the docker build done by `uses: ./` cannot receive secrets.
      # Pre-build the npm layers through the echohq registry so that build reuses them from the local docker cache.
      - name: Pre-build npm layers through echohq registry
        env:
          ECHO_LIBRARIES_ACCESS_KEY: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
          DOCKER_BUILDKIT: "1"
        run: |
          NPMRC="${RUNNER_TEMP}/npmrc"
          umask 077
          printf 'registry=https://npm.echohq.com/\n//npm.echohq.com/:_authToken=%s\n' "${ECHO_LIBRARIES_ACCESS_KEY}" > "${NPMRC}"
          docker build --target builder --secret "id=npmrc,src=${NPMRC}" .
          rm -f "${NPMRC}"
      - name: Test KICS action
        uses: ./
        with:
          path: test/samples/positive1.tf,test/samples/positive2.tf
          token: ${{ secrets.GITHUB_TOKEN }}
          timeout: 60
          output_path: myoutput/
          output_formats: sarif
          ignore_on_exit: results
          enable_comments: true
          enable_annotations: true
          enable_jobs_summary: true
          comments_with_queries: true
          excluded_column_for_comments_with_queries: "description_id,similarity_id,search_line,search_value,cis_description_id,cis_description_title,cis_description_text,cloud_provider"
      - run: ls -la && ls -la myoutput
        if: always()
